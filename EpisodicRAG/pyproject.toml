[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "episodicrag"
version = "5.9.0"
description = "EpisodicRAG - Hierarchical digest generation for long-term memory"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Weave"}
]
readme = "GLOSSARY.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime dependencies (none - uses Python standard library only)
dependencies = []

[project.urls]
Homepage = "https://github.com/Bizuayeu/Plugins-Weave"
Repository = "https://github.com/Bizuayeu/Plugins-Weave"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["agents*", "skills*", "commands*", "docs*", "data*"]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-cov~=6.0",
    "ruff~=0.16.0",
    "mypy~=2.3.0",
    "pre-commit~=4.0",
    "hypothesis~=6.122",
    "bandit~=1.9",
]

[tool.pytest.ini_options]
# テストディレクトリ
testpaths = ["scripts/test"]
# Pythonパス（sys.path.insertの代替）
pythonpath = ["scripts"]

# テストファイルのパターン
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# カスタムマーカー
markers = [
    "unit: 単体テスト（高速、外部依存なし）",
    "integration: 統合テスト（ファイルI/O）",
    "slow: 時間のかかるテスト",
    "property: Property-based tests using hypothesis",
    "performance: パフォーマンス・ベンチマークテスト",
    "cli: CLI統合テスト（subprocess経由）",
]

# デフォルトオプション
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=scripts",
    # branch=true は下の [tool.coverage.run] にもあるが、そちらは子プロセスへ伝播しない。
    # pytest-cov が COV_CORE_BRANCH を立てるのは CLI 側の --cov-branch のときだけで、
    # これが無いと subprocess 経由テストの子が statement-only のデータを書き、
    # 親の branch データとの combine が DataError で落ちる。
    "--cov-branch",
    "--cov-report=term-missing",
]

# 非推奨警告を無視
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["scripts"]
branch = true
omit = [
    "scripts/test/*",
    "*/__pycache__/*",
    "scripts/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
src = ["scripts"]
include = ["scripts/**/*.py", "skills/wakeup/scripts/**/*.py"]
exclude = [".pytest_cache", "__pycache__", ".venv", "*.egg-info"]


[tool.ruff.lint]
# ruff の default 選択は版が上がるたび広がるので明示固定する。集合はワークスペース共通の 10 個。
# 狭い select では CI が green のまま旧記法・危険記法（B904 の例外連鎖切断、B017 の
# 例外型を絞らない assertRaises、PTH の os.path 残存）が溜まる。E501 は本集合に
# 含まれない＝行長は formatter の担当。
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# テスト名は日本語で書く（`test_50件ちょうどはover_threshold_false` 等）。日本語には
# 大文字小文字の区別が無いため N802「lowercase にせよ」は構造上適用できない。
"scripts/test/*" = ["F401", "N802", "N806"]
# N806 はテスト内の `patch(...) as MockConfig` 等。unittest.mock の慣習で「クラスの
# モックはクラス名の形で置く」ため、lowercase 化すると何を差し替えているか読めなくなる。
#
# wakeup skill は claude.ai へ zip で配る stdlib のみの独立ツリーで、str のパスを
# 自前 API の境界（`config_path: str` / `out_dir: str` / `self._root: str`）で受け渡す。
# 冒頭の `sys.path.insert` は **要素が str でなければ import が黙って失敗する**
# （実測: ModuleNotFoundError）。一箇所だけ Path 化すると型が混ざるため、
# **ツリーごと PTH を外す**。昇格トリガー: wakeup の API 契約を Path 化するとき。
"skills/wakeup/scripts/**" = ["PTH"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "interfaces", "config", "usecases"]
known-third-party = ["pytest", "hypothesis"]

# =============================================================================
# Mypy Configuration - Strict Mode for 100% Type Coverage
# =============================================================================

[tool.mypy]
python_version = "3.10"

# Strict mode settings (equivalent to --strict flag)
strict = true
warn_redundant_casts = true
warn_unused_configs = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true

# Allow Any for valid use cases (validation functions, logging)
disallow_any_generics = false

# Import settings
ignore_missing_imports = true

# Test layer: enabled with relaxed settings (Phase 1)
# exclude = ["scripts/test/"]  # Removed to enable test type checking

# Domain layer: already 100% compliant
[[tool.mypy.overrides]]
module = "domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Application / Infrastructure / Interfaces layers: 100% type coverage.
# モジュールはグロブで指定する。個別列挙は追加・改名・削除のたびに置き去りになり、
# 実際に config.* と application.validators が消えた後も残っていた（mypy が
# unused section として警告していた）。層単位で掛ければ新規モジュールも自動で対象になる。
[[tool.mypy.overrides]]
module = ["application", "application.*", "infrastructure", "infrastructure.*", "interfaces", "interfaces.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Test layer: 本番コード100% type-safe達成
# テストはTypedDict検証のため意図的に不正な型を渡すケースがあり
# TypedDict/Union型エラーは設定で抑制不可のため、テスト層は型チェック対象外
[[tool.mypy.overrides]]
module = [
    "test.*",
]
ignore_errors = true
