[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emailingessay"
version = "1.2.3"
description = "EmailingEssay - AI essay delivery via email"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Weave"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime dependencies
dependencies = [
    "yagmail>=0.15",
]

[project.urls]
Homepage = "https://github.com/Bizuayeu/Plugins-Weave"
Repository = "https://github.com/Bizuayeu/Plugins-Weave"

[tool.setuptools.packages.find]
where = ["skills/send-email"]
include = ["scripts*"]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-cov~=6.0",
    "ruff~=0.11",
    "mypy~=2.3.0",
    "bandit~=1.9",
]

[tool.pytest.ini_options]
testpaths = ["skills/send-email/scripts/tests"]
pythonpath = ["skills/send-email/scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=skills/send-email/scripts",
    # branch=true は下の [tool.coverage.run] にもあるが、そちらは子プロセスへ伝播しない。
    # pytest-cov が COV_CORE_BRANCH を立てるのは CLI 側の --cov-branch のときだけで、
    # これが無いと subprocess 経由テストの子が statement-only のデータを書き、
    # 親の branch データとの combine が DataError で落ちる。
    "--cov-branch",
    "--cov-report=term-missing",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["skills/send-email/scripts"]
branch = true
omit = [
    "skills/send-email/scripts/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
src = ["skills/send-email/scripts"]
include = ["skills/send-email/scripts/**/*.py"]
exclude = [".pytest_cache", "__pycache__", ".venv", "*.egg-info"]


[tool.ruff.lint]
# ワークスペース共通の 10 集合（E4,E7,E9,F,I,UP,N,B,SIM,PTH）を床にし、
# 本プラグインが既に持っていた C4 / RUF はそのまま残す（和集合であって置換ではない）。
select = [
    "E4", "E7", "E9", "F", "I",  # 基本ルール（E501 は選ばない＝行長は formatter の担当）
    "B",                          # bugbear（バグの可能性）
    "C4",                         # comprehension（内包表記）
    "N",                          # naming（命名規約）
    "PTH",                        # pathlib（os.path 残存の検出）
    "UP",                         # pyupgrade（Python 3.10+最適化）
    "SIM",                        # simplify（コード簡素化）
    "RUF",                        # Ruff固有ルール
]
ignore = [
    "RUF002",    # ambiguous-unicode-character-docstring（日本語docstring許可）
    "RUF003",    # ambiguous-unicode-character-comment（日本語コメント許可）
]

[tool.ruff.lint.per-file-ignores]
# tests/ は各ファイル冒頭で `sys.path.insert(0, os.path.dirname(...os.path.abspath(__file__)))`
# を実行して scripts/ を import 可能にする（19 ファイル）。**sys.path の要素は str でなければ
# ならず**、Path を入れると import が黙って失敗する（実測: ModuleNotFoundError）。
# PTH の助言はこの起動行に構造上適用できないので外す。
"skills/send-email/scripts/tests/*" = ["F401", "PTH"]
# Win32 API の定数を SDK（winbase.h）の綴りのまま置く箇所。プラットフォーム側の名前に
# 合わせているので lowercase 化は適用できない。
"skills/send-email/scripts/adapters/process/spawner.py" = ["N806"]
"skills/send-email/scripts/adapters/storage/waiter_storage.py" = ["N806"]
"skills/send-email/scripts/domain/__init__.py" = ["RUF022"]  # カテゴリ別__all__を維持

# =============================================================================
# Mypy Configuration - Strict Mode (Phase 3)
# =============================================================================

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true  # Phase 3: 有効化

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
