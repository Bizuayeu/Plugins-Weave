[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegramsecretary"
version = "1.15.1"
description = "Telegram Bot API の long-polling を cloud routine 上で常駐させ、認可済みチャットからのメッセージに秘書エージェント（SecretaryRole）が即応する対話チャネル"
license = {text = "MIT"}
requires-python = ">=3.10"
# base 依存は httpx のみ（Medium 運用＝media を扱わない構成の最小起動セット）。
# heavy 依存は media / voice extras に分離し、bootstrap.sh が tier に応じて
# `pip install -e .[media,voice]` 等で導入する（ピンの正典は本ファイル、bootstrap は再記述しない）。
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# media extras: ドキュメント・PDF render（TELEGRAM_SECRETARY_MEDIA_ENABLE_DOWNLOAD!=false で導入）。
# - markitdown: docx/pptx/xlsx を markdown 化してエージェントに渡す。内部で mammoth (docx 読込) /
#   python-pptx / openpyxl / magika (ML model) / onnxruntime 等の再帰依存を連れてくる点に留意。
#   ※ docx 読込は mammoth であり python-docx は引かれない（python-docx は書込用）。
#     テストは fixture 生成に python-docx を使うため dev extras 側で別途宣言する。
# - pdfplumber: PDF テキスト層抽出。MIT（配布安全）。pymupdf(AGPL) は同等品質だが配布制約のため不採用。
# - pypdfium2: スキャン・図面 PDF を全ページ画像化し to_pil() で png 保存（Vision 経路）。
#   pdf_renderer が直接 import するため直接依存として明示（pdfplumber が transitive に引くが、
#   コードが直接使う依存は明示する原則＋再現性のため直接化）。
# - Pillow: pypdfium2.bitmap.to_pil() が要する（pypdfium2 は Pillow を任意依存にするため明示）。
#   下限は 12.3 — 9.1〜12.2 に PYSEC 系の既知脆弱性が積み上がっており、本番は受信メディア
#   （＝外部入力の画像・PDF）を復号する経路なので、脆弱な Pillow の混入を宣言で塞ぐ。
#   12.3.0 は requires-python >=3.10 で cp310 wheel があり、CI の 3.10 レグを壊さない。
media = [
    "markitdown[docx,pptx,xlsx]>=0.1.6",
    "pdfplumber>=0.11",
    "pypdfium2>=4.18.0",
    "Pillow>=12.3",
]
# voice extras: 音声 STT（TELEGRAM_SECRETARY_BUNDLE_VOICE!=false で media と併せて導入）。
# - moonshine-voice: Moonshine 日本語 STT（torch-free・onnxruntime、日本語 base-ja モデルは
#   ランタイムDL ~134MB）。Community License は年商$1M未満は商用も無料だが、年商 $1M 以上の本番は
#   Enterprise License が必要 → 本番商用化前に Enterprise 契約 or kotoba-whisper(Apache-2.0) へ
#   MediaRenderer Port 差し替え。
# - av (PyAV): ffmpeg を wheel 内包し OGG/OPUS/mp4 を 16kHz mono float へ decode（システム ffmpeg 不要）。
voice = [
    "moonshine-voice>=0.0.59",
    "av>=17.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    # テスト fixture を動的生成するための書込ライブラリ群（git に巨大バイナリを置かない方針）。
    # python-docx は markitdown[docx] では引かれない（読込は mammoth）ため必須。
    # python-pptx / openpyxl は markitdown[pptx,xlsx] でも入るが、テスト依存を
    # markitdown の内部依存に暗黙依存させず明示する（fresh clone / CI の再現性）。
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    # PDF fixture: テスト内で動的生成（git に巨大バイナリを置かない方針、
    # docx を python-docx で生成するのと同型）。reportlab は本番依存ではない。
    "reportlab>=4.0",
]

[tool.setuptools]
# コードは pythonpath=["scripts"] で解決し、配布パッケージ化はしない（editable install は依存導入専用）。
# 明示しないと setuptools が flat-layout auto-discovery で skills/commands/templates を
# 複数トップレベルパッケージと誤検出し、`pip install -e .` がビルド失敗する。
packages = []

[tool.ruff]
# ruff 0.16 以降は Markdown 内の ```python コードブロックも整形・検査の対象に含む。
# 本プラグインの .md は配布ドキュメント（README / SKILL）であり、例示コードを 88 桁で
# 折り返すと読み物としての可読性が落ちるため対象から外す。
# 整形の対象は Python ソースのみ、というのが本リポの方針（CI もこの設定で検査する）。
extend-exclude = ["*.md"]

[tool.ruff.lint]
# 選択ルールは明示する。CI は `pip install ruff` で最新版を引くため、既定ルールセットに
# 依存すると ruff 側の既定拡張だけで CI が赤くなる（0.16.0 が既定を拡張し実際に発生）。
# 中身は従来の既定（E4/E7/E9/F）＝本プラグインが実際に守ってきた水準を固定したもの。
#
# I（import 整列）と UP（pyupgrade）を追加する。従来の狭い select では検出されないまま
# typing.Dict / Optional[X] / os.error 等の旧記法が 300 件規模で残存していた（CI は green のまま）。
# 一度 `ruff check --fix` で解消したうえでルールとして固定し、再混入を CI で止める。
# requires-python = ">=3.10" から target-version が推論されるため、PEP 585/604 記法は安全に使える。
#
# N（naming）/ B（bugbear）/ SIM（simplify）/ PTH（pathlib）を追加する。狙いは I/UP と同じで、
# 「CI が green のまま旧記法・危険記法が溜まる」経路を塞ぐこと。実際に B904（例外連鎖の欠落＝
# 原因例外が traceback から消える）・SIM105（try-except-pass の握り潰し）・PTH（os.path 系の残存）
# が検出された。挙動を変えずに直せるものは直し、直せないものは下の ignore に理由付きで残す。
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
# テストは Stage 見出しコメントで節分けし、その節で使う import を節の直下に置く
# （どの Stage が何を要求するかを読み取れる形）。E402 はこの構成を咎めるだけなので外す。
"scripts/tests/*" = ["E402"]
# atomic 書込の publish は os.replace のまま置く。Python 3.10 の pathlib は accessor 経由で
# import 時に os.replace を束縛するため、Path.replace にするとクラッシュ注入テストの
# monkeypatch が素通りし、「旧内容が残る」不変条件が 3.10 で無検査になる（実際に CI 3.10 で
# 6 件 red になった）。検査可能性を優先し、この 1 ファイルだけ PTH105 を外す。
"scripts/adapters/atomic_io.py" = ["PTH105"]

[tool.mypy]
# scripts/ を import root にする。これが無いと自前モジュール（domain.* 等）が
# 「インストール済みだがスタブが無い第三者パッケージ」と誤認され、解決漏れだけで
# 300 件超の診断が出る（実測 330 → 18）。
mypy_path = "scripts"
explicit_package_bases = true

# 本番コードは strict。ワークスペースの ToBe（A の lint ＋ B の mypy）に揃える。
# strict でしか出ない型は実在する: os.path.join → Path(a) / b の機械変換で str が Path に
# 変わり sys.path へ流れた不具合は、112 件のテストを素通りして strict mypy だけが捕らえた。
strict = true

[[tool.mypy.overrides]]
# 型スタブを持たないサードパーティ。グローバルに ignore_missing_imports すると
# 自前モジュールの解決漏れまで黙って通るので、当該モジュールだけに限定する。
module = [
    "moonshine_voice",
    "moonshine_voice.*",
    "openpyxl",
    "openpyxl.*",
    "pypdfium2",
    "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# テスト層は strict の対象外。ここで出る 1200 件超は全て no-untyped-def / no-untyped-call、
# 中身は test 関数への `-> None` 付与という機械的増補で、バグ検出への寄与がほぼ無い一方、
# 双子（ShioriSecretary）との diff 監査面積だけが増える。テストの担保は pytest が持つ。
# EpisodicRAG / JootoGrabber が同じ形（strict = true ＋ テスト層 ignore_errors）を先に採っている。
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
