[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visualexpression"
version = "1.2.0"
description = "VisualExpression - Expression grid to HTML builder for AI avatars"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Weave"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime dependencies
dependencies = [
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Bizuayeu/Plugins-Weave"
Repository = "https://github.com/Bizuayeu/Plugins-Weave"

[tool.setuptools.packages.find]
where = ["skills/scripts"]
include = ["MakeExpressionJson*"]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-cov~=6.0",
    "ruff~=0.11",
    "mypy~=2.3.0",
    "bandit~=1.9",
]

[tool.pytest.ini_options]
testpaths = ["skills/scripts/MakeExpressionJson/tests"]
pythonpath = ["skills/scripts/MakeExpressionJson"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=skills/scripts/MakeExpressionJson",
    "--cov-report=term-missing",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["skills/scripts/MakeExpressionJson"]
branch = true
omit = [
    "skills/scripts/MakeExpressionJson/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
src = ["skills/scripts/MakeExpressionJson"]
include = ["skills/scripts/MakeExpressionJson/**/*.py"]
exclude = [".pytest_cache", "__pycache__", ".venv", "*.egg-info"]


[tool.ruff.lint]
# ワークスペース共通の 10 集合（E4,E7,E9,F,I,UP,N,B,SIM,PTH）を床にし、
# 本プラグインが既に持っていた C4 / RUF はそのまま残す（和集合であって置換ではない）。
select = [
    "E4", "E7", "E9", "F", "I",  # 基本ルール（E501 は formatter の担当なので選ばない）
    "B",                          # bugbear（バグの可能性）
    "C4",                         # comprehension（内包表記）
    "N",                          # naming（命名規約）
    "PTH",                        # pathlib（os.path 残存の検出）
    "UP",                         # pyupgrade（Python 3.10+最適化）
    "SIM",                        # simplify（コード簡素化）
    "RUF",                        # Ruff固有ルール
]
ignore = [
    "RUF002",    # ambiguous-unicode-character-docstring（日本語docstring許可）
    "RUF003",    # ambiguous-unicode-character-comment（日本語コメント許可）
]

# N999（パッケージ名が lowercase でない）は `MakeExpressionJson` 自体を指す。この名前は
# pythonpath / setuptools の include / coverage の source / スキル文書が揃って指す公開名で、
# 改名しても得るものが無く参照の張り替えだけが残る。ruff の助言が構造上適用できない例。
[tool.ruff.lint.per-file-ignores]
"skills/scripts/MakeExpressionJson/**/__init__.py" = ["N999"]
"skills/scripts/MakeExpressionJson/main.py" = ["E402"]  # sys.path操作のため必要
"skills/scripts/MakeExpressionJson/tests/*" = ["F401"]  # フィクスチャのインポートで未使用に見えるケースのみ許容

# =============================================================================
# Mypy Configuration - Strict Mode (Phase 3)
# =============================================================================

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true  # Phase 3: 有効化
explicit_package_bases = true  # モジュール名解決の曖昧さを解消
# import root。これが無いと `from domain.validators import ...` が解決できず、
# ignore_missing_imports が黙らせて全て Any になる（症状は no-any-return だけが漏れる）。
mypy_path = "skills/scripts/MakeExpressionJson"

[[tool.mypy.overrides]]
module = [
    # mypy_path を入れたので import root は MakeExpressionJson。テストは `tests.*` で当たる
    # （旧 `skills.scripts.MakeExpressionJson.tests.*` はどのモジュールにも一致していなかった）。
    "tests.*",
]
ignore_errors = true
