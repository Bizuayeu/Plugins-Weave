[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emotionpulse"
version = "1.4.0"
description = "EmotionPulse - Emotion vector display for Claude Code statusline"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Weave"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/Bizuayeu/Plugins-Weave"
Repository = "https://github.com/Bizuayeu/Plugins-Weave"

[tool.setuptools]
# コードは pythonpath=["."] で解決し、配布パッケージ化はしない（editable install は依存導入専用）。
# 明示しないと setuptools が flat-layout auto-discovery で hooks/commands を
# 複数トップレベルパッケージと誤検出し、`pip install -e .` がビルド失敗する。
packages = []

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-cov~=6.0",
    "ruff~=0.11",
    "mypy~=2.3.0",
    "bandit~=1.9",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=scripts",
    "--cov-report=term-missing",
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["scripts"]
branch = true
omit = [
    "scripts/tests/*",
    "scripts/__main__.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py310"
src = ["scripts"]
include = ["scripts/**/*.py", "hooks/**/*.py"]
exclude = [".pytest_cache", "__pycache__", ".venv", "*.egg-info"]


[tool.ruff.lint]
# ワークスペース共通の 10 集合（E4,E7,E9,F,I,UP,N,B,SIM,PTH）を床にし、
# 本プラグインが既に持っていた C4 / RUF はそのまま残す（和集合であって置換ではない）。
select = [
    "E4", "E7", "E9", "F", "I",  # E501 は選ばない（行長は formatter の担当）
    "B",
    "C4",
    "N",
    "PTH",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["F401"]
# hooks/ は sys.path を自力で組んでから plugin 本体を import する起動スクリプト。
# E402: import を先頭へ集めると sys.path が未構築のまま解決に失敗する。
# PTH: 候補パスは最終的に `sys.path.insert()` へ渡る。**sys.path の要素は str でなければ
# ならず**、Path を入れると import が黙って失敗する（実測: ModuleNotFoundError）。
# ここだけは os.path のまま置く——移植性より、起動が成立することを取る。
"hooks/*" = ["E402", "PTH"]

# =============================================================================
# Mypy Configuration
# =============================================================================

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["scripts.tests.*"]
ignore_errors = true
