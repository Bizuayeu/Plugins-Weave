name: CI

on:
  push:
    branches: [main]
    paths:
      - 'EpisodicRAG/**'
      - 'EmailingEssay/**'
      - 'VisualExpression/**'
      - 'TelegramSecretary/**'
      - 'EmotionPulse/**'
      - 'ContextPreloader/**'
      - 'ConsiderateCoder/**'
      - 'LoopExporter/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'EpisodicRAG/**'
      - 'EmailingEssay/**'
      - 'VisualExpression/**'
      - 'TelegramSecretary/**'
      - 'EmotionPulse/**'
      - 'ContextPreloader/**'
      - 'ConsiderateCoder/**'
      - 'LoopExporter/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff linter
        working-directory: EpisodicRAG
        run: ruff check scripts/

      - name: Run ruff formatter check
        working-directory: EpisodicRAG
        run: ruff format --check scripts/

      # wakeup skill: self-contained stdlib-only tree (scripts/ of the skill itself)
      - name: Run ruff linter (wakeup skill)
        working-directory: EpisodicRAG
        run: ruff check skills/wakeup/scripts/

      - name: Run ruff formatter check (wakeup skill)
        working-directory: EpisodicRAG
        run: ruff format --check skills/wakeup/scripts/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit security scan
        working-directory: EpisodicRAG
        run: bandit -r scripts/ --exclude scripts/test --severity-level medium

      # wakeup skill handles PATs (archive extraction, Authorization headers)
      - name: Run Bandit security scan (wakeup skill)
        working-directory: EpisodicRAG
        run: bandit -r skills/wakeup/scripts/ --exclude skills/wakeup/scripts/tests --severity-level medium

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy==2.3.0

      - name: Run mypy
        working-directory: EpisodicRAG/scripts
        run: mypy --explicit-package-bases .

      # wakeup skill: production layers only (its tests are untyped, like scripts/test)
      - name: Run mypy (wakeup skill)
        working-directory: EpisodicRAG/skills/wakeup/scripts
        run: mypy --strict --ignore-missing-imports --explicit-package-bases domain usecases interfaces

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e EpisodicRAG[dev]

      # shell: bash は pipefail 目的（tee 越しでも pytest の失敗で job を落とす）。
      - name: Run tests with coverage
        working-directory: EpisodicRAG
        shell: bash
        run: |
          # Deterministic gate for coverage: wall-clock tests (slow / performance) are
          # excluded here and run in the dedicated performance job below.
          python -m pytest -m "not slow and not performance" --cov-report=xml --cov-fail-under=80 -v 2>&1 | tee pytest_output.txt
          # Extract test count from pytest summary line (e.g., "556 passed").
          # The count is this job's selection only (slow / performance deselected).
          TEST_COUNT=$(grep -oP '\d+(?= passed)' pytest_output.txt | head -1 || echo "0")
          echo "TEST_COUNT=$TEST_COUNT" >> $GITHUB_ENV
          echo "Detected $TEST_COUNT tests"

      # wakeup skill: own conftest + import root, so it runs as a separate invocation.
      # addopts/testpaths are overridden because the root config targets scripts/test only.
      - name: Run wakeup skill tests
        working-directory: EpisodicRAG/skills/wakeup/scripts
        run: python -m pytest tests -v --override-ini="addopts=" --override-ini="testpaths="

      - name: Generate test badge JSON
        if: matrix.python-version == '3.11'
        working-directory: EpisodicRAG
        run: |
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"$TEST_COUNT passed\",\"color\":\"brightgreen\"}" > test_badge.json
          cat test_badge.json

      # exuanbo/actions-deploy-gist は Node20 ランナー固定で後継メジャーが無い（＝版上げでは
      # deprecation 警告を消せない）ため、gh api の PATCH /gists/:id で置き換える。
      # Gist 側のファイル名は shields.io の参照先なので basename の test_badge.json を維持する。
      # shell: bash は pipefail 目的（jq が落ちたら gh を走らせずに job を落とす）。
      - name: Upload test badge to Gist
        if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: EpisodicRAG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.TEST_BADGE_GIST_ID }}
        run: |
          jq -n --rawfile body test_badge.json \
            '{files: {"test_badge.json": {content: $body}}}' \
            | gh api -X PATCH "gists/$GIST_ID" --input - --silent

      - name: Upload test results artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            EpisodicRAG/pytest_output.txt
            EpisodicRAG/coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: EpisodicRAG/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  performance:
    runs-on: ubuntu-latest
    needs: test
    # Run on main branch push or PR (optional for PRs)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e EpisodicRAG[dev]

      # shell: bash は pipefail 目的（tee 越しでも pytest の失敗で job を落とす）。
      # 旧実装は $? が tee の成功を拾ってしまうため、出力を grep して失敗件数を数える
      # 自前ゲートで代用していた。pipefail が効けばパイプライン自体が非ゼロで落ちるので、
      # 集計と exit の分岐は到達しない（＝削除）。回帰閾値 10% はテスト側の assert が持つ。
      - name: Run performance tests
        working-directory: EpisodicRAG
        shell: bash
        run: |
          echo "Running performance and slow tests..."
          python -m pytest -m "slow or performance" --no-cov -v --tb=short 2>&1 | tee perf_output.txt

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: EpisodicRAG/perf_output.txt

  # =============================================================================
  # EmailingEssay Jobs
  # =============================================================================

  lint-emailingessay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff linter
        working-directory: EmailingEssay
        run: ruff check skills/send-email/scripts/

      - name: Run ruff formatter check
        working-directory: EmailingEssay
        run: ruff format --check skills/send-email/scripts/

  security-emailingessay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit security scan
        working-directory: EmailingEssay
        run: bandit -r skills/send-email/scripts/ --exclude skills/send-email/scripts/tests --severity-level medium

  type-check-emailingessay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy==2.3.0 yagmail

      - name: Run mypy
        working-directory: EmailingEssay/skills/send-email/scripts
        run: mypy --explicit-package-bases .
        continue-on-error: true

  test-emailingessay:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e EmailingEssay[dev]

      # shell: bash は pipefail 目的（tee 越しでも pytest の失敗で job を落とす）。
      - name: Run tests with coverage
        working-directory: EmailingEssay
        shell: bash
        run: |
          python -m pytest --cov-report=xml --cov-fail-under=70 -v 2>&1 | tee pytest_output.txt
          TEST_COUNT=$(grep -oP '\d+(?= passed)' pytest_output.txt | head -1 || echo "0")
          echo "TEST_COUNT=$TEST_COUNT" >> $GITHUB_ENV
          echo "Detected $TEST_COUNT tests"

      - name: Upload test results artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: emailingessay-test-results
          path: |
            EmailingEssay/pytest_output.txt
            EmailingEssay/coverage.xml

  # =============================================================================
  # VisualExpression Jobs
  # =============================================================================

  lint-visualexpression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff linter
        working-directory: VisualExpression
        run: ruff check skills/scripts/MakeExpressionJson/

      - name: Run ruff formatter check
        working-directory: VisualExpression
        run: ruff format --check skills/scripts/MakeExpressionJson/

  security-visualexpression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit security scan
        working-directory: VisualExpression
        run: bandit -r skills/scripts/MakeExpressionJson/ --exclude skills/scripts/MakeExpressionJson/tests --severity-level medium

  type-check-visualexpression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy==2.3.0 pillow

      - name: Run mypy
        working-directory: VisualExpression/skills/scripts/MakeExpressionJson
        run: mypy --explicit-package-bases --exclude tests .

  test-visualexpression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e VisualExpression[dev]

      # shell: bash は pipefail 目的（tee 越しでも pytest の失敗で job を落とす）。
      - name: Run tests with coverage
        working-directory: VisualExpression
        shell: bash
        run: |
          python -m pytest --cov-report=xml --cov-fail-under=70 -v 2>&1 | tee pytest_output.txt
          TEST_COUNT=$(grep -oP '\d+(?= passed)' pytest_output.txt | head -1 || echo "0")
          echo "TEST_COUNT=$TEST_COUNT" >> $GITHUB_ENV
          echo "Detected $TEST_COUNT tests"

      - name: Upload test results artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: visualexpression-test-results
          path: |
            VisualExpression/pytest_output.txt
            VisualExpression/coverage.xml

  # =============================================================================
  # TelegramSecretary Jobs
  # =============================================================================

  lint-telegramsecretary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # 整形結果は ruff のバージョンに依存するため固定する。本プラグインは
      # Products/ShioriSecretary と同一コードの二重管理であり、両者を同じ版で
      # 揃えないと差分が出る。更新は「ruff を上げて ruff format を再適用する」commit として
      # 意図的に行う（自動追随させない）。
      - name: Install ruff
        run: pip install ruff==0.16.0

      # 検査範囲はプラグイン root（`.`）。scripts/ 限定だと skills/ 等に置いた .py が
      # 素通りする（双子リポ ShioriSecretary は既に `.`）。除外は pyproject の
      # extend-exclude で明示管理し、この workflow には書かない。
      - name: Run ruff linter
        working-directory: TelegramSecretary
        run: ruff check .

      - name: Run ruff formatter check
        working-directory: TelegramSecretary
        run: ruff format --check .

  security-telegramsecretary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit security scan
        working-directory: TelegramSecretary
        run: bandit -r scripts/ --exclude scripts/tests --severity-level medium

  test-telegramsecretary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # media/voice extras まで入れる: テストは実 markitdown / PyAV を呼び、
      # numpy も extras 経由でしか入らないため [dev] だけでは collection が失敗する。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "TelegramSecretary[dev,media,voice]"

      # pyproject に addopts が無いため --cov を明示する（他プラグインは addopts 側で指定済み）。
      # shell: bash は pipefail 目的（tee 越しでも pytest の失敗で job を落とす）。
      - name: Run tests with coverage
        working-directory: TelegramSecretary
        shell: bash
        run: |
          python -m pytest --cov=scripts --cov-report=xml --cov-fail-under=70 -v 2>&1 | tee pytest_output.txt
          TEST_COUNT=$(grep -oP '\d+(?= passed)' pytest_output.txt | head -1 || echo "0")
          echo "TEST_COUNT=$TEST_COUNT" >> $GITHUB_ENV
          echo "Detected $TEST_COUNT tests"

      - name: Upload test results artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: telegramsecretary-test-results
          path: |
            TelegramSecretary/pytest_output.txt
            TelegramSecretary/coverage.xml

  # =============================================================================
  # EmotionPulse Jobs
  # =============================================================================

  lint-emotionpulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      # 対象範囲は pyproject の include（scripts/** + hooks/**）が決める。
      - name: Run ruff linter
        working-directory: EmotionPulse
        run: ruff check .

      - name: Run ruff formatter check
        working-directory: EmotionPulse
        run: ruff format --check .

  security-emotionpulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit security scan
        working-directory: EmotionPulse
        run: bandit -r scripts/ --exclude scripts/tests --severity-level medium

  type-check-emotionpulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy==2.3.0

      - name: Run mypy
        working-directory: EmotionPulse
        run: mypy scripts/

  test-emotionpulse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # editable install は依存導入専用（pyproject の packages = [] を参照）。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "EmotionPulse[dev]"

      # --cov / --cov-fail-under(90) は pyproject の addopts / coverage 設定側が持つ。
      # shell: bash は pipefail 目的（tee 越しでも pytest の失敗で job を落とす）。
      - name: Run tests with coverage
        working-directory: EmotionPulse
        shell: bash
        run: python -m pytest --cov-report=xml -v 2>&1 | tee pytest_output.txt

      - name: Upload test results artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: emotionpulse-test-results
          path: |
            EmotionPulse/pytest_output.txt
            EmotionPulse/coverage.xml

  # =============================================================================
  # ContextPreloader Jobs
  # =============================================================================

  test-contextpreloader:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pyproject を持たない stdlib-only プラグイン（editable install する対象が無い）ため、
      # 他プラグインの `pip install -e X[dev]` ではなく pytest 単体を入れる。
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # rootdir 直下に __init__.py が無いので、pytest の prepend import mode が
      # ContextPreloader/ を sys.path に載せ、テスト側の `import scripts` が解決する。
      - name: Run tests
        working-directory: ContextPreloader
        run: python -m pytest scripts/tests -v

  # =============================================================================
  # ConsiderateCoder Jobs
  # =============================================================================

  test-consideratecoder:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 規範・テンプレート群を検査する stdlib-only スイート（pyproject 無し）。
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # marketplace.json をリポジトリ root から参照するため、checkout 全体が必要。
      - name: Run tests
        working-directory: ConsiderateCoder
        run: python -m pytest tests -v

  # =============================================================================
  # LoopExporter Jobs
  # =============================================================================

  test-loopexporter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 依存ゼロ（node:test / node:assert のみ）ゆえ install step は無い。
      # 実行コマンドは package.json の scripts.test が SSoT。
      - name: Run tests
        working-directory: LoopExporter
        run: npm test
